<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThinkBallot — Measure (mock)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div class="mock-ribbon">Mock · placeholder data · not real ballot information · ThinkBallot demo</div>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html"><span class="mark">✓</span>ThinkBallot</a>
  <nav class="site-nav">
    <a href="ballot.html" class="active">My ballot</a>
    <a href="search.html">Search</a>
    <a href="qa.html">Ask</a>
    <a href="methodology.html">Methodology</a>
    <a id="auth-chip" class="auth-chip" href="account.html">sign in</a>
  </nav>
</div></header>

<main id="item-main"></main>

<footer class="site-footer"><div class="inner">
  <span>ThinkBallot · mock demo</span>
  <span class="spacer"></span>
  <a href="api.html">API for developers</a>
  <a href="gov.html">For election officials</a>
  <a href="instance.html">Hosted instance demo</a>
  <a href="methodology.html">How we stay neutral</a>
</div></footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const id = TBApp.param("id", "prop-61");
  const m = TB.findItem(id);
  const main = document.getElementById("item-main");
  if (!m || m.type !== "measure") {
    main.innerHTML = `<div class="notice">Unknown measure. <a href="ballot.html">Back to your ballot.</a></div>`;
    return;
  }
  document.title = "ThinkBallot — " + m.title + " (mock)";

  main.innerHTML = `
    <div class="eyebrow">${TBApp.esc(m.scope)} measure · ${TBApp.esc(TB.election.name)}</div>
    <h1>${TBApp.esc(m.title)}</h1>
    <p class="lede">${TBApp.esc(m.summary)} ${m.sources.map((s) => TBApp.srcChip(s)).join(" ")}</p>
    <p class="hint" style="margin-top:.8rem">Sponsor: ${TBApp.esc(m.sponsors[0])} ·
      Topics: ${m.topics.map((t) => `<span class="chip">${TBApp.esc(t)}</span>`).join(" ")}</p>

    <div class="yesno">
      <div><h4>A yes vote means</h4><p>${TBApp.esc(m.yes)} ${TBApp.srcChip("src-sos")}</p></div>
      <div><h4>A no vote means</h4><p>${TBApp.esc(m.no)} ${TBApp.srcChip("src-sos")}</p></div>
    </div>

    <div class="args">
      <div class="col"><h4>Arguments for</h4><ul>
        ${m.argsFor.map((a) => `<li>${TBApp.esc(a.text)} ${TBApp.srcChip(a.src)}</li>`).join("")}
      </ul></div>
      <div class="col"><h4>Arguments against</h4><ul>
        ${m.argsAgainst.map((a) => `<li>${TBApp.esc(a.text)} ${TBApp.srcChip(a.src)}</li>`).join("")}
      </ul></div>
    </div>
    <p class="equal-note">Arguments are drawn from the official ballot arguments and shown with equal prominence.</p>

    <h2>Fiscal impact</h2>
    <p>${TBApp.esc(m.fiscal.text)} ${TBApp.srcChip(m.fiscal.src)}</p>

    <div class="sources-block">
      <div class="eyebrow">Sources — every field above traces to one of these</div>
      <ul>${m.sources.map((s) => `<li><span class="mono">[${s.replace("src-", "")}]</span> ${TBApp.esc(TB.sources[s].label)}</li>`).join("")}</ul>
    </div>

    <p style="margin-top:1.6rem"><a class="btn ghost small" href="ballot.html">← Back to your ballot</a>
    <a class="btn ghost small" href="qa.html">Ask a question about this measure</a></p>

    ${TBApp.communityZone(m.id)}
  `;
});
</script>
</body>
</html>
