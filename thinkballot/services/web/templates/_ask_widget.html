<form class="ask-form" data-measure="{{ measure_id }}">
  <input type="text" name="question" maxlength="300" placeholder="Type a question" aria-label="Your question about this proposition"
    autocomplete="off" enterkeyhint="send" required>
  <button class="btn" type="submit">Ask</button>
</form>
<div class="canned" role="group" aria-label="Suggested questions">
  {% for q in suggested_questions %}<button type="button" class="suggest">{{ q }}</button>{% endfor %}
</div>
<div class="ask-result" aria-live="polite"></div>
